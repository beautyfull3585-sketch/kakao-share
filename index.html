<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>거래처 카톡 공유</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="theme-color" content="#1b2f66">
<style>
  :root {
    --bg: #f6f6f4; --card: #fff; --text: #1d1d1b; --muted: #6b6b66;
    --line: #e2e2dc; --accent: #fee500; --accent-text: #191600; --danger: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --card: #22221f; --text: #f0f0ea; --muted: #a3a39b; --line: #3a3a35; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.5 -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 8px 0 16px; }
  h2 { font-size: 16px; margin: 0 0 8px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
            padding: 16px; margin-bottom: 12px; }
  textarea { width: 100%; font: inherit; color: inherit; background: transparent;
             border: 1px solid var(--line); border-radius: 8px; padding: 10px; resize: vertical; }
  .row { display: flex; gap: 8px; align-items: center; }
  .hint { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
  button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text);
           border-radius: 8px; padding: 10px 14px; cursor: pointer; }
  button.primary { width: 100%; background: var(--accent); color: var(--accent-text);
                   border-color: var(--accent); font-weight: 700; padding: 14px; font-size: 17px; }
  ul { list-style: none; padding: 0; margin: 8px 0 0; }
  #vendors li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
  #vendors li span { flex: 1; }
  #vendors li button { padding: 4px 10px; font-size: 13px; }
  .status { margin: 10px 0 0; font-size: 14px; }
  .status.error { color: var(--danger); }
  /* PC 넓은 화면: 왼쪽은 보낼 내용, 오른쪽은 거래처 목록 */
  @media (min-width: 900px) {
    main { max-width: 1100px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
    main > h1 { grid-column: 1 / -1; }
  }
</style>
</head>
<body>
<main>
  <h1>거래처 카톡 공유</h1>

  <div>
    <section>
      <h2>보낼 메시지</h2>
      <textarea id="message" rows="6" placeholder="예) 안녕하세요, 이번 주 신상품 입고 안내드립니다."></textarea>
    </section>

    <section>
      <h2>보낼 이미지 (선택)</h2>
      <div class="row">
        <input type="file" id="image" accept="image/*" style="flex:1">
        <button id="clearImage" hidden>빼기</button>
      </div>
      <img id="preview" alt="" hidden style="display:block;max-width:100%;max-height:240px;margin-top:10px;border-radius:8px">
    </section>

    <section>
      <button class="primary" id="send"></button>
      <button class="primary" id="copyImage" hidden style="margin-top:8px">사진 복사</button>
      <p class="hint" id="howto"></p>
      <p class="status" id="status" role="status"></p>
    </section>
  </div>

  <section>
    <h2>거래처 목록</h2>
    <textarea id="newVendors" rows="2" placeholder="거래처 이름 (여러 곳은 쉼표나 줄바꿈으로)"></textarea>
    <button id="addVendor" style="margin-top:8px;width:100%">목록에 추가</button>
    <ul id="vendors"></ul>
  </section>
</main>

<script>
  const store = {
    get(k, fallback) { try { const v = localStorage.getItem(k); return v === null ? fallback : JSON.parse(v); } catch { return fallback; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const $ = (id) => document.getElementById(id);
  function setStatus(text, isError) {
    $('status').textContent = text;
    $('status').className = 'status' + (isError ? ' error' : '');
  }

  // 휴대폰은 기본 공유 화면으로, PC는 복사 후 카톡에 붙여넣는 방식으로 보냅니다.
  const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)
    || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.platform));
  $('send').textContent = isMobile ? '카톡으로 보내기' : '글 복사';
  $('howto').textContent = isMobile
    ? '공유 화면에서 카카오톡을 고르고, 거래처를 체크해 보내세요.'
    : 'PC 카톡 나와의 채팅에 Ctrl+V로 붙여넣어 보낸 뒤, 말풍선 오른쪽 클릭 → 전달로 거래처를 골라 보내세요.';

  // 메시지: 마지막으로 쓴 내용을 기억합니다.
  const message = $('message');
  message.value = store.get('message', '');
  message.addEventListener('input', () => store.set('message', message.value));

  // 이미지
  const imageInput = $('image');
  const preview = $('preview');
  function clearImage() {
    imageInput.value = '';
    preview.hidden = true;
    preview.removeAttribute('src');
    $('clearImage').hidden = true;
    $('copyImage').hidden = true;
  }
  $('clearImage').addEventListener('click', () => { clearImage(); setStatus(''); });
  imageInput.addEventListener('change', () => {
    const file = imageInput.files[0];
    if (!file) { clearImage(); return; }
    preview.src = URL.createObjectURL(file);
    preview.hidden = false;
    $('clearImage').hidden = false;
    $('copyImage').hidden = isMobile;
  });

  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch { return false; }
  }

  $('send').addEventListener('click', async () => {
    const text = message.value.trim();
    const file = imageInput.files[0];
    if (!isMobile) {
      if (!text) { setStatus('복사할 메시지를 입력해 주세요.', true); message.focus(); return; }
      setStatus(await copyText(text)
        ? '글을 복사했어요. 카톡에 Ctrl+V로 붙여넣으세요.'
        : '복사하지 못했어요. 글을 직접 선택해서 복사해 주세요.');
      return;
    }
    if (!text && !file) { setStatus('보낼 메시지나 이미지를 넣어 주세요.', true); message.focus(); return; }
    const data = {};
    if (text) data.text = text;
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) data.files = [file];
    if (!navigator.share) { setStatus('이 브라우저는 공유를 지원하지 않아요. 크롬이나 사파리로 열어 주세요.', true); return; }
    try {
      await navigator.share(data);
      setStatus('');
    } catch (e) {
      if (e.name !== 'AbortError') setStatus('공유 화면을 열지 못했어요: ' + e.message, true);
    }
  });

  // PC: 사진을 PNG로 바꿔 클립보드에 넣습니다.
  async function toPngBlob(file) {
    if (file.type === 'image/png') return file;
    const img = await createImageBitmap(file);
    const canvas = document.createElement('canvas');
    canvas.width = img.width; canvas.height = img.height;
    canvas.getContext('2d').drawImage(img, 0, 0);
    return await new Promise(r => canvas.toBlob(r, 'image/png'));
  }
  $('copyImage').addEventListener('click', async () => {
    const file = imageInput.files[0];
    if (!file) return;
    try {
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': await toPngBlob(file) })]);
      setStatus('사진을 복사했어요. 카톡에 Ctrl+V로 붙여넣으세요.');
    } catch {
      setStatus('사진을 복사하지 못했어요. 사진 파일을 카톡 창에 직접 끌어다 놓아 주세요.', true);
    }
  });

  // 거래처 목록 (이 기기에만 저장). 처음 열면 기본 거래처가 들어 있습니다.
  const DEFAULT_VENDORS = ['플로르', '소가', '네일레본', '스토니', '네일바이진', '유자', '슈베'];
  let vendors = store.get('vendors', []).map(v => typeof v === 'string' ? v : v.name);
  if (!store.get('defaultsAdded', false)) {
    DEFAULT_VENDORS.forEach(n => { if (!vendors.includes(n)) vendors.push(n); });
    store.set('vendors', vendors);
    store.set('defaultsAdded', true);
  }
  function saveVendors() { store.set('vendors', vendors); renderVendors(); }
  function renderVendors() {
    const ul = $('vendors');
    ul.innerHTML = '';
    vendors.forEach((name, i) => {
      const li = document.createElement('li');
      const span = document.createElement('span');
      span.textContent = name;
      const del = document.createElement('button');
      del.textContent = '삭제';
      del.addEventListener('click', () => { vendors.splice(i, 1); saveVendors(); });
      li.append(span, del);
      ul.append(li);
    });
  }
  $('addVendor').addEventListener('click', () => {
    const names = $('newVendors').value.split(/[,，\n]/).map(n => n.trim()).filter(Boolean);
    names.forEach(n => { if (!vendors.includes(n)) vendors.push(n); });
    $('newVendors').value = '';
    saveVendors();
  });
  renderVendors();
</script>
</body>
</html>
